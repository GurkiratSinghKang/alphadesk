<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted)}
  .row{display:flex;align-items:center;gap:12px}
  .bar{height:16px;background:var(--gold-500);border-radius:2px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);width:60px}
  .name{font-family:var(--font-ui);font-size:11px;color:var(--fg);width:40px;text-align:right;text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding-top:8px;border-top:1px solid var(--border-hair)}
  .radius{aspect-ratio:1;background:var(--bg-elev-2);border:1px solid var(--border);display:flex;align-items:flex-end;justify-content:center;padding:6px;font-family:var(--font-mono);font-size:9px;color:var(--fg-muted);letter-spacing:0}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Spacing scale · 4px base</div>
  <div class="row"><div class="name">1</div><div class="bar" style="width:4px"></div><div class="lbl">4px</div></div>
  <div class="row"><div class="name">2</div><div class="bar" style="width:8px"></div><div class="lbl">8px</div></div>
  <div class="row"><div class="name">3</div><div class="bar" style="width:12px"></div><div class="lbl">12px</div></div>
  <div class="row"><div class="name">4</div><div class="bar" style="width:16px"></div><div class="lbl">16px</div></div>
  <div class="row"><div class="name">6</div><div class="bar" style="width:24px"></div><div class="lbl">24px</div></div>
  <div class="row"><div class="name">8</div><div class="bar" style="width:32px"></div><div class="lbl">32px</div></div>
  <div class="row"><div class="name">12</div><div class="bar" style="width:48px"></div><div class="lbl">48px</div></div>
  <div class="row"><div class="name">16</div><div class="bar" style="width:64px"></div><div class="lbl">64px</div></div>
</div>
</body></html>
