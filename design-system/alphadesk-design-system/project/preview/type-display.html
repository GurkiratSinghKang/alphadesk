<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:28px 32px;display:flex;flex-direction:column;gap:12px}
  .eyebrow{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted)}
  .specimen{font-family:var(--font-display);font-size:76px;line-height:0.95;letter-spacing:-0.03em;color:var(--ink-1000);font-style:italic;font-weight:400;text-wrap:balance}
  .specimen .reg{font-style:normal;color:var(--fg-dim)}
  .meta{display:flex;gap:20px;margin-top:8px;font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
  .meta span b{color:var(--fg);font-weight:500}
  .glyphs{font-family:var(--font-display);font-size:22px;color:var(--fg-dim);letter-spacing:0.05em;font-style:italic}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Display · Newsreader italic</div>
  <div class="specimen">Make <span class="reg">money</span> while you <span>sleep</span>.</div>
  <div class="glyphs">AaBbCc · α β δ · 1234567890 · &amp; §</div>
  <div class="meta">
    <span>Weight <b>400</b></span>
    <span>Optical size <b>60–72</b></span>
    <span>Tracking <b>−0.03em</b></span>
    <span>Leading <b>1.02</b></span>
  </div>
</div>
</body></html>
