name: Deploy AlphaDesk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm run test -- --run

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name for Docker tags
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}-backend:latest

      # Sync the compose + infrastructure config to the VPS BEFORE the
      # image pull. Host's /opt/alphadesk config files were drifting from
      # the repo in prior deploys — e.g. port bindings in docker-compose.yml
      # never took effect because the VPS had stale copies.
      - name: Sync config to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,infrastructure/*"
          target: "/opt/alphadesk/"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,FRONTEND_IMAGE,BACKEND_IMAGE
          script: |
            set -e
            cd /opt/alphadesk
            # Authenticate to GHCR with the ephemeral job token so the
            # VPS can pull the images built seconds earlier in this run.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Load non-compose secrets from .env.prod so compose can
            # interpolate them (REDIS_PASSWORD, STATUS_PASS_HASH, etc.).
            set -a
            . ./.env.prod
            set +a
            docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml pull frontend backend
            # --remove-orphans tears down services deleted from the compose
            # (e.g. uptime-kuma). --force-recreate picks up config-only
            # changes (e.g. port rebinds) that don't change the image hash.
            docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --remove-orphans --force-recreate
            sleep 15
            curl -sf http://localhost:8000/health || (echo "Health check failed!" && exit 1)
            # Tidy up old images without touching anything younger than 24h.
            docker system prune -f --filter "until=24h"
            docker logout ghcr.io
            echo "Deploy successful: ${FRONTEND_IMAGE} + ${BACKEND_IMAGE}"
