services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: alphadesk-timescaledb
    ports:
      # Loopback-only: accessible from host for local dev (psql, migrations),
      # NOT exposed on 0.0.0.0. Docker publishes via its own iptables chain
      # which bypasses UFW — binding to 127.0.0.1 is the only safe default.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: alphadesk
      POSTGRES_PASSWORD: alphadesk_dev
      POSTGRES_DB: alphadesk
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphadesk -d alphadesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: alphadesk-redis
    ports:
      # Loopback-only — see timescaledb comment above.
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-alphadesk_redis_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alphadesk_redis_dev}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphadesk-backend
    ports:
      # Loopback-only — Caddy proxies to backend:8000 on the internal
      # docker network. No reason to expose publicly.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://alphadesk:alphadesk_dev@timescaledb:5432/alphadesk
      REDIS_URL: redis://:${REDIS_PASSWORD:-alphadesk_redis_dev}@redis:6379/0
      ENVIRONMENT: dev
      DEBUG: "true"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphadesk-frontend
    ports:
      # Loopback-only — Caddy proxies to frontend:3000 on the internal network.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
