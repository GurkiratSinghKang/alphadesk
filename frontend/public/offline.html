<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>AlphaDesk — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0a09;
        --fg: #f5f3eb;
        --fg-muted: #8b8780;
        --brand: #d4a64a;
        --border: #28241f;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          "Helvetica Neue", Arial, sans-serif;
        min-height: 100dvh;
      }
      main {
        max-width: 540px;
        margin: 0 auto;
        padding: 64px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        justify-content: center;
        min-height: 100dvh;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-muted);
        margin: 0;
      }
      h1 {
        font-size: 32px;
        line-height: 1.1;
        font-weight: 400;
        font-style: italic;
        font-family: "Newsreader", "Iowan Old Style", "Times New Roman", Georgia, serif;
        margin: 0;
        max-width: 14ch;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: var(--fg-muted);
        margin: 0;
        max-width: 48ch;
      }
      a {
        align-self: flex-start;
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--brand);
        color: var(--bg);
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 13px;
      }
      a:hover { filter: brightness(1.1); }
      small {
        color: var(--fg-muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">§ · No connection</p>
      <h1>AlphaDesk is offline.</h1>
      <p>
        Trading data needs a live connection — quotes, positions, and
        orders all flow through the broker over the network. Reconnect
        and refresh, and the desk picks up where it left off.
      </p>
      <a id="retry-link" href="/" onclick="location.href=this.href; return false;">Try again</a>
      <small>If you keep seeing this page, check your network or VPN.</small>
    </main>
    <!--FROM_URL_PLACEHOLDER-->
    <script>
      // QA r3 BUG-05: preserve the original deep-link the user was trying
      // to reach. The SW injects window.__originalUrl before serving this
      // page. If present, point the retry link there instead of "/".
      try {
        if (window.__originalUrl) {
          document.getElementById("retry-link").href = window.__originalUrl;
        }
      } catch (_) { /* gracefully fall through to "/" */ }
    </script>
  </body>
</html>
