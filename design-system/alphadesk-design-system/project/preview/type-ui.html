<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:28px 32px;display:flex;flex-direction:column;gap:20px}
  .eyebrow{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted);border-bottom:1px solid var(--border);padding-bottom:6px}
  .row{display:flex;align-items:baseline;gap:24px;border-bottom:1px solid var(--border-hair);padding-bottom:12px}
  .row:last-child{border:0;padding-bottom:0}
  .row .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);width:100px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.05em}
  .row .spec{flex:1;color:var(--fg)}
  .h1{font-size:28px;font-weight:500;letter-spacing:-0.02em}
  .h2{font-size:22px;font-weight:500;letter-spacing:-0.015em}
  .h3{font-size:17px;font-weight:500}
  .body{font-size:14px;color:var(--fg-dim);line-height:1.5}
  .sm{font-size:13px;color:var(--fg-dim)}
  .label{font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted)}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">UI · Inter Tight</div>
  <div class="row"><div class="lbl">h1 · 28 / 500</div><div class="spec h1">Portfolio &amp; positions</div></div>
  <div class="row"><div class="lbl">h2 · 22 / 500</div><div class="spec h2">Six strategies, one desk</div></div>
  <div class="row"><div class="lbl">h3 · 17 / 500</div><div class="spec h3">Claude-powered analysis</div></div>
  <div class="row"><div class="lbl">body · 14</div><div class="spec body">Systematic execution with a human in the loop. All orders require regime approval.</div></div>
  <div class="row"><div class="lbl">label · 10.5</div><div class="spec label">Open positions · Active strategies</div></div>
</div>
</body></html>
