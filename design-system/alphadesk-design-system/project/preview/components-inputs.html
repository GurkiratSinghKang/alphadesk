<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:26px;display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .lbl{font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted)}
  .input{height:36px;background:var(--bg-elev-1);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;color:var(--fg);font-family:var(--font-mono);font-size:13px;outline:none;transition:border-color 140ms var(--ease)}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(201,166,107,0.12)}
  .input.filled{color:var(--ink-1000)}
  .input.error{border-color:var(--down-500)}
  .hint{font-family:var(--font-display);font-style:italic;font-size:12px;color:var(--fg-muted)}
  .hint.err{color:var(--down-500)}
  .group{display:flex;align-items:center;height:36px;background:var(--bg-elev-1);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .group .adorn{padding:0 12px;font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);border-right:1px solid var(--border);text-transform:uppercase;letter-spacing:0.08em}
  .group input{background:transparent;border:0;padding:0 12px;height:100%;flex:1;color:var(--ink-1000);font-family:var(--font-mono);font-size:13px;outline:none;width:100%}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Form inputs</div>
  <div class="row">
    <div class="field">
      <div class="lbl">Symbol</div>
      <input class="input filled" value="NVDA"/>
      <div class="hint">Ticker · case-insensitive</div>
    </div>
    <div class="field">
      <div class="lbl">Quantity</div>
      <div class="group"><input value="250"/><span class="adorn">shares</span></div>
      <div class="hint">Fractional supported</div>
    </div>
    <div class="field">
      <div class="lbl">Limit price</div>
      <div class="group"><span class="adorn">$</span><input value="134.28"/></div>
      <div class="hint">&mdash;</div>
    </div>
    <div class="field">
      <div class="lbl">Stop loss</div>
      <input class="input error" value="-5.0%"/>
      <div class="hint err">Must be ≥ 3% per risk policy</div>
    </div>
  </div>
</div>
</body></html>
