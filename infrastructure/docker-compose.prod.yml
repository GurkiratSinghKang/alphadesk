services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      STATUS_USER: ${STATUS_USER:-admin}
      STATUS_PASS_HASH: ${STATUS_PASS_HASH}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alphadesk
    mem_limit: 256m
    cpus: 0.25

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/alphadesk-frontend:latest}
    restart: unless-stopped
    volumes: []
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 0.5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/alphadesk-backend:latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Override base compose dev values — environment: takes precedence over env_file:
      ENVIRONMENT: prod
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://alphadesk:${POSTGRES_PASSWORD:-alphadesk_dev}@timescaledb:5432/alphadesk
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - /var/lib/alphadesk/pipeline_logs:/app/data/pipeline_logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1536m
    cpus: 1.0

  timescaledb:
    volumes:
      - /var/lib/alphadesk/timescaledb:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 1.5

  redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - /var/lib/alphadesk/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 640m
    cpus: 0.5

  # uptime-kuma: removed 2026-04-17 (Wave E / iter-2).
  # Had zero monitors configured; consuming ~56 MB RSS + 724 MB image for
  # no benefit. On-disk data preserved at /var/lib/alphadesk/uptime-kuma
  # so the service can be re-added later and pick up its existing DB.

networks:
  alphadesk:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
