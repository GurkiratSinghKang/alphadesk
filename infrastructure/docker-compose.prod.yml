services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      STATUS_USER: ${STATUS_USER:-admin}
      # Must be set — bcrypt hash for the /status endpoint basic-auth.
      STATUS_PASS_HASH: ${STATUS_PASS_HASH:?STATUS_PASS_HASH is required}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Same 50m×5 (250 MB) policy as every other service so Caddy access
        # logs — the only record of who hit which URL — survive longer than
        # a few hours. See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.25

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/alphadesk-frontend:latest}
    restart: unless-stopped
    volumes: []
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1.0

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/alphadesk-backend:latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Override base compose dev values — environment: takes precedence over env_file:
      ENVIRONMENT: prod
      DEBUG: "false"
      # Secrets MUST be set in .env.prod (or the shell env). No dev-password
      # fallback — docker compose will refuse to start if either is missing.
      # See audit-reports/security-audit-r3.md P0 #2.
      DATABASE_URL: postgresql+asyncpg://alphadesk:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/alphadesk
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    volumes:
      - /var/lib/alphadesk/pipeline_logs:/app/data/pipeline_logs
      # Claude Code CLI OAuth creds (Max subscription). The agents in
      # backend/agents/base.py shell out to `claude -p` via subprocess;
      # if ANTHROPIC_API_KEY is unset (or empty) the CLI falls back to
      # these creds. The refresh token rotates automatically — mount
      # read-write so the CLI can update the file on renewal.
      - /root/.claude:/root/.claude
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 4g
    cpus: 2.0

  timescaledb:
    volumes:
      - /var/lib/alphadesk/timescaledb:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 3g
    cpus: 2.0

  redis:
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - /var/lib/alphadesk/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 1200m
    cpus: 1.0

  # uptime-kuma: removed 2026-04-17 (Wave E / iter-2).
  # Had zero monitors configured; consuming ~56 MB RSS + 724 MB image for
  # no benefit. On-disk data preserved at /var/lib/alphadesk/uptime-kuma
  # so the service can be re-added later and pick up its existing DB.

networks:
  alphadesk:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
