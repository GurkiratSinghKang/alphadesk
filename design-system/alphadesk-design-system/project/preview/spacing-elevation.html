<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:28px;display:flex;flex-direction:column;gap:20px}
  .eyebrow{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-muted)}
  .row{display:flex;gap:16px;align-items:center;justify-content:center}
  .box{width:110px;height:80px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
  .s1{box-shadow:var(--shadow-1)}
  .s2{box-shadow:var(--shadow-2)}
  .sg{box-shadow:var(--shadow-glow-gold);border-color:var(--brand-dim)}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Elevation · Depth from border, not shadow</div>
  <div class="row">
    <div class="box">hair</div>
    <div class="box s1">01</div>
    <div class="box s2">02</div>
    <div class="box sg" style="color:var(--brand)">glow</div>
  </div>
  <div style="font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--fg-dim);text-align:center;margin-top:-4px">Shadows are almost invisible — depth comes from the border hairline and background lightness.</div>
</div>
</body></html>
