<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:24px;display:flex;flex-direction:column;gap:18px}
  .caption{display:flex;justify-content:space-between;align-items:baseline}
  .caption .ttl{font-family:var(--font-display);font-style:italic;font-size:18px;color:var(--ink-1000);letter-spacing:-0.02em}
  .caption .desc{font-family:var(--font-ui);font-size:11px;color:var(--fg-muted);letter-spacing:0.16em;text-transform:uppercase}
  .row{display:flex;gap:12px}
  .big{flex:2;height:140px;display:flex;align-items:flex-end;padding:16px;background:var(--brand);color:#1a1206;border-radius:var(--radius-sm);position:relative;overflow:hidden}
  .big::before{content:"α";position:absolute;top:-40px;right:-10px;font-family:var(--font-display);font-style:italic;font-size:220px;color:rgba(26,18,6,0.2);line-height:1}
  .big .lbl{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:0.16em;font-size:10px;font-weight:600;opacity:0.8}
  .big .hex{font-family:var(--font-mono);font-size:22px;margin-top:4px;font-weight:500}
  .big .nm{font-family:var(--font-display);font-style:italic;font-size:15px;margin-top:2px}
  .col{flex:1;display:flex;flex-direction:column;gap:6px}
  .tile{flex:1;border-radius:var(--radius-sm);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--border-hair)}
  .tile .tk{font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,0.55);font-weight:500}
  .tile.dk .tk{color:rgba(255,255,255,0.7)}
</style></head>
<body>
<div class="card">
  <div class="caption"><div class="ttl">Liquid gold</div><div class="desc">Brand accent · 5 stops</div></div>
  <div class="row">
    <div class="big">
      <div><div class="lbl">Brand primary</div><div class="hex">#c9a66b</div><div class="nm">gold-500</div></div>
    </div>
    <div class="col">
      <div class="tile" style="background:var(--gold-100)"><span class="tk">100 · #f5e6b8</span></div>
      <div class="tile" style="background:var(--gold-300)"><span class="tk">300 · #e0c070</span></div>
      <div class="tile dk" style="background:var(--gold-600)"><span class="tk">600 · #b08a45</span></div>
      <div class="tile dk" style="background:var(--gold-700)"><span class="tk">700 · #8c6d2f</span></div>
    </div>
  </div>
</div>
</body></html>
