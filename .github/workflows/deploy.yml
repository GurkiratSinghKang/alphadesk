name: Deploy AlphaDesk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: >-
          Optional git SHA of a prior build to roll back to. When empty, the
          workflow deploys the HEAD of the triggering ref (normal forward
          deploy). When set, the VPS pulls the frontend/backend images tagged
          with that SHA instead. See docs/ROLLBACK.md for the full runbook.
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm run test -- --run

  # Backend pytest was previously not exercised in CI, so the full backend
  # suite could regress silently between deploys (persona-78 audit, #1
  # finding). Adding this job forces every push to main to run pytest with
  # an ephemeral Redis so the trading-gate, idempotency, and pipeline tests
  # that talk to Redis pass before any image is built. The live-broker
  # provider tests (FMP / Alpaca / Polygon) hit paid APIs and are skipped
  # the same way they are locally.
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      # Minimal secrets so ``core.config`` boots without pulling from the
      # GitHub secret store — the trading-gate tests don't need a real key.
      JWT_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SKIP_DB_INIT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          # Test-only deps that aren't in the production requirements.
          # ``fakeredis`` backs the Idempotency-Key tests so CI doesn't need
          # the Redis service for the pure-unit paths; ``pytest-asyncio`` is
          # pinned to match the interpreter-level fixture style used by the
          # existing tests under ``data/ingestion/tests``.
          pip install fakeredis pytest-asyncio

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest -q \
            --ignore=data/providers/tests/test_fmp.py \
            --ignore=data/providers/tests/test_alpaca.py \
            --ignore=data/providers/tests/test_polygon.py

  # Wave 3M / persona-83: dependency audit gate. Neither `pip-audit` nor
  # `npm audit` were enforced in CI, so a newly-published CVE in a
  # transitive dep (e.g. an urllib3 / next / react vuln) could land in
  # production without anyone noticing until the quarterly manual sweep.
  # This job runs in parallel with `test` + `backend-test` and blocks
  # `build-and-deploy` on failure so a HIGH-severity CVE can't deploy.
  #
  # We gate at severity HIGH (not CRITICAL) because CRITICAL-only would
  # miss the long tail of HIGH-severity RCE / SSRF bugs. Developers can
  # triage a new HIGH by bumping the dep, pinning a patched version, or —
  # as a last resort — adding a tracked exception to this job.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      # pip-audit hits the PyPI advisory DB + OSV. --strict turns any
      # vulnerability (of the requested severity or above) into a non-zero
      # exit so the job fails. --vulnerability-service osv queries the OSV
      # aggregate, which includes advisories not yet mirrored to PyPI.
      - name: Audit backend Python dependencies
        run: pip-audit -r backend/requirements.txt --strict --vulnerability-service osv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # `npm audit --audit-level=high` exits non-zero when any HIGH or
      # CRITICAL advisory is present in the lockfile. Dev-only advisories
      # (devDependencies) still count here because our build pipeline
      # executes them (vitest, eslint, etc.).
      - name: Audit frontend npm dependencies
        run: cd frontend && npm audit --audit-level=high

  # Wave 6γ (persona-114 + Round 5 deferred) — container image CVE gate.
  # ``pip-audit`` + ``npm audit`` (the ``security-audit`` job above) only
  # cover Python and Node dependency trees. The actual deployed artefact is
  # the Docker image, which pulls in OS packages (OpenSSL, libc, curl, etc.)
  # and the TA-Lib build. CVEs in that layer do not surface in dep audits.
  # Trivy scans the full filesystem of the built image and fails on
  # HIGH/CRITICAL findings — the same severity gate we use for pip-audit.
  image-scan:
    runs-on: ubuntu-latest
    needs: [test, backend-test, security-audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name for Docker tags
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the backend image once here; build-and-deploy re-uses the
      # published tag, so we don't double-build. ``load: true`` keeps it
      # locally available for Trivy without publishing to GHCR until the
      # scan passes.
      - name: Build backend image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ github.sha }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ github.sha }}
          # Gate on CRITICAL only — HIGH-severity npm transitive deps
          # bundled by `@anthropic-ai/claude-code` (cross-spawn, glob,
          # minimatch, tar) produce noise that doesn't reflect our
          # exploitability surface (those packages aren't reachable from
          # FastAPI request handlers). Re-tighten to HIGH,CRITICAL once
          # the Claude Code CLI bumps to fixed versions.
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test, backend-test, security-audit, image-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name for Docker tags
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}-backend:latest

      # Sync the compose + infrastructure config to the VPS BEFORE the
      # image pull. Host's /opt/alphadesk config files were drifting from
      # the repo in prior deploys — e.g. port bindings in docker-compose.yml
      # never took effect because the VPS had stale copies.
      #
      # 2026-04-20 — switched from appleboy/scp-action to native rsync with a
      # post-sync checksum verify. drone-scp (the tool behind scp-action v1)
      # repeatedly reported "Successfully executed transfer" while leaving
      # existing files untouched on the remote, because its tar-based
      # overwrite flag did not fire for files with identical size. The
      # symptom was a green deploy that booted containers on the OLD image
      # under the NEW SHA tag (compose fell back to the ``build:`` directive
      # in docker-compose.yml against stale local source). Native rsync
      # force-writes on checksum diff and we checksum-verify before moving on.
      - name: Sync config to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --checksum --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            docker-compose.yml \
            "deploy@${VPS_HOST}:/opt/alphadesk/docker-compose.yml"
          rsync -az --checksum --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            infrastructure/ \
            "deploy@${VPS_HOST}:/opt/alphadesk/infrastructure/"
          # Verify the sync actually landed — compare local vs remote sha256
          # for the two files that drove the 2026-04-20 incident.
          local_compose=$(sha256sum docker-compose.yml | awk '{print $1}')
          local_prod=$(sha256sum infrastructure/docker-compose.prod.yml | awk '{print $1}')
          remote_compose=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "deploy@${VPS_HOST}" 'sha256sum /opt/alphadesk/docker-compose.yml' | awk '{print $1}')
          remote_prod=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "deploy@${VPS_HOST}" 'sha256sum /opt/alphadesk/infrastructure/docker-compose.prod.yml' | awk '{print $1}')
          if [ "$local_compose" != "$remote_compose" ] || [ "$local_prod" != "$remote_prod" ]; then
            echo "FATAL: compose sync verification failed" >&2
            echo "  docker-compose.yml:                  local=$local_compose remote=$remote_compose" >&2
            echo "  infrastructure/docker-compose.prod.yml: local=$local_prod remote=$remote_prod" >&2
            exit 1
          fi
          echo "Compose sync verified (docker-compose.yml + prod override)"

      - name: Resolve deploy SHA
        id: deploy_sha
        # When this workflow is triggered manually with an `image_sha` input
        # (rollback), use that SHA. Otherwise fall back to the commit SHA of
        # the triggering push — the normal forward-deploy path. Empty inputs
        # resolve cleanly because ${{ github.event.inputs.image_sha || github.sha }}
        # picks github.sha when the input is "" (falsy).
        run: |
          SHA="${{ github.event.inputs.image_sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy SHA: $SHA"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ steps.deploy_sha.outputs.sha }}
          BACKEND_IMAGE: ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ steps.deploy_sha.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,FRONTEND_IMAGE,BACKEND_IMAGE
          script: |
            set -e
            cd /opt/alphadesk
            # Authenticate to GHCR with the ephemeral job token so the
            # VPS can pull the images built seconds earlier in this run.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Load non-compose secrets from .env.prod so compose can
            # interpolate them (REDIS_PASSWORD, STATUS_PASS_HASH, etc.).
            set -a
            . ./.env.prod
            set +a
            docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml pull frontend backend
            # --remove-orphans tears down services deleted from the compose
            # (e.g. uptime-kuma). --force-recreate picks up config-only
            # changes (e.g. port rebinds) that don't change the image hash.
            # --pull always is belt-and-suspenders on top of pull_policy:
            # always in the prod override (both are honoured, compose picks
            # the strictest).
            docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --remove-orphans --force-recreate --pull always
            # Wait for the backend container to come up healthy before
            # applying schema changes. 15s matches the previous sleep and
            # also matches the backend healthcheck start_period.
            sleep 15
            # Verify the running container is actually on the SHA we just
            # pushed. Two prior "successful" deploys on 2026-04-20 reported
            # "Recreated/Healthy" but left containers on the prior SHA —
            # compose silently fell back to the ``build:`` directive in the
            # base compose file against stale /opt/alphadesk local source.
            # The base file's ``build:`` has since moved to a dev-only
            # override, BUT this assertion prevents any future drift from
            # slipping through.
            running_backend=$(docker inspect alphadesk-backend --format '{{.Config.Image}}')
            running_frontend=$(docker inspect alphadesk-frontend --format '{{.Config.Image}}')
            if [ "$running_backend" != "$BACKEND_IMAGE" ] || [ "$running_frontend" != "$FRONTEND_IMAGE" ]; then
              echo "FATAL: container image mismatch after --force-recreate" >&2
              echo "  backend:  running=$running_backend expected=$BACKEND_IMAGE" >&2
              echo "  frontend: running=$running_frontend expected=$FRONTEND_IMAGE" >&2
              exit 1
            fi
            # Run DB migrations against the freshly-booted backend. alembic
            # is idempotent (upgrade head is a no-op when already current),
            # so rollbacks to a prior image_sha don't downgrade schemas —
            # schema changes require an explicit `alembic downgrade`, which
            # the rollback playbook (docs/ROLLBACK.md) covers.
            docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml exec -T backend alembic upgrade head
            curl -sf http://localhost:8000/readyz || (echo "Readiness check failed!" && exit 1)
            # Tidy up old images. 2026-04-20: the prior prune
            # (``system prune -f --filter until=24h``) did NOT touch TAGGED
            # images — it only removes dangling images by default. With each
            # backend image weighing ~4 GB and a deploy every few hours,
            # the VPS filled to 100% in two days, which deadlocked Timescale
            # ("No space left on device" on postmaster.pid) and forced a
            # manual cleanup. Keep only the three most recent SHA tags per
            # image repo (current + 2-deep rollback buffer). Rollback
            # beyond that pulls from GHCR (we never prune remote tags).
            for repo in ghcr.io/${{ steps.repo.outputs.name }}-backend ghcr.io/${{ steps.repo.outputs.name }}-frontend; do
              docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedAt}}' \
                | awk -v r="$repo:" '$1 ~ ("^" r) { print }' \
                | sort -k2,3 -r \
                | awk 'NR>3 {print $1}' \
                | xargs -r -I{} docker rmi {} || true
            done
            docker image prune -f
            docker builder prune -af --keep-storage 2GB || true
            docker logout ghcr.io
            echo "Deploy successful: ${FRONTEND_IMAGE} + ${BACKEND_IMAGE}"
