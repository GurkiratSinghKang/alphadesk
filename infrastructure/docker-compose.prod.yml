services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      STATUS_USER: ${STATUS_USER:-admin}
      # Must be set — bcrypt hash for the /status endpoint basic-auth.
      STATUS_PASS_HASH: ${STATUS_PASS_HASH:?STATUS_PASS_HASH is required}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Persist Caddy's access logs to the host so oncall can join them with
      # backend logs by request-id long after the container is recreated.
      # The Caddyfile writes JSON access logs to /var/log/caddy/access.log
      # (see `log { output file ... }` block); without this bind-mount those
      # logs live inside the container's writable layer and disappear on
      # every `docker compose up --force-recreate`. Host path must exist and
      # be writable by the caddy container's user (root inside alpine image).
      #   sudo mkdir -p /var/log/alphadesk/caddy
      - /var/log/alphadesk/caddy:/var/log/caddy
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Same 50m×5 (250 MB) policy as every other service so Caddy access
        # logs — the only record of who hit which URL — survive longer than
        # a few hours. See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.25

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/alphadesk-frontend:latest}
    # Force compose to pull the tagged image from GHCR every deploy instead
    # of falling back to the ``build:`` directive in the base compose file.
    # Without this, on the VPS a stale /opt/alphadesk/frontend source tree
    # (scp only syncs compose + infrastructure/) gets rebuilt and tagged with
    # the new SHA, overwriting the freshly-pushed GHCR image. The container
    # then boots with old code under a new tag — exactly what happened on
    # 2026-04-20 when the /pairs-stat-arb duplicate fix did not land.
    pull_policy: always
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Server-side Next proxy auth checks must talk to the backend over the
      # compose network. Falling back to the public domain can fail from inside
      # the container and causes successful logins to be bounced back to /login.
      API_URL: http://backend:8000
    volumes: []
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1.0

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/alphadesk-backend:latest}
    # See frontend.pull_policy — same fix for the same reason. Without it,
    # docker compose will silently fall back to ``build: ./backend`` on the
    # VPS and tag the local stale build as the new SHA.
    pull_policy: always
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Override base compose dev values — environment: takes precedence over env_file:
      ENVIRONMENT: prod
      DEBUG: "false"
      # Secrets MUST be set in .env.prod (or the shell env). No dev-password
      # fallback — docker compose will refuse to start if either is missing.
      # See audit-reports/security-audit-r3.md P0 #2.
      DATABASE_URL: postgresql+asyncpg://alphadesk:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/alphadesk
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # Persist TradingAgents bootstrap, venv, upstream checkout, and generated
      # research artifacts across image swaps. Without this explicit env, the
      # wrapper falls back to the container user's ephemeral ~/.cache path and
      # saved reports degrade to signal-only records after deploys.
      TRADINGAGENTS_SKILL_HOME: ${TRADINGAGENTS_SKILL_HOME:-/app/data/tradingagents-skill}
      # Wave 6β Fix 4 (from Round-5 deferred + persona 106): surface the
      # live-trading kill-switch as a first-class compose env so an
      # operator staring at this file can immediately tell whether the
      # container is configured for paper or LIVE.  Previously the flag
      # was hidden inside ``.env.prod`` — an oncall could infer the mode
      # only by grepping that file (which they shouldn't routinely touch
      # because it also holds the password secrets).
      #
      # Default is ``false`` so a brand-new deploy is paper-only until
      # the operator EXPLICITLY flips it in ``.env.prod``.  See
      # ``docs/DEPLOYMENT.md`` under "Going live" for the full checklist
      # (ALPACA_BASE_URL must point at api.alpaca.markets and
      # halt_state.is_halted must be FALSE as well).
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
    volumes:
      - /var/lib/alphadesk/pipeline_logs:/app/data/pipeline_logs
      # Optional raw Claude request/response audit trail. Enable with
      # CLAUDE_AUDIT_LOG_ENABLED=true in .env.prod; keep this host path
      # root/operator-readable only because prompts can contain trading
      # context and user identifiers.
      - /var/log/alphadesk/claude:/app/logs/claude
      # Claude Code CLI OAuth creds (fallback only). BaseAgent now prefers
      # the Anthropic API whenever ANTHROPIC_API_KEY is configured; the CLI
      # path remains available for CLAUDE_BACKEND=cli or auto mode without
      # an API key. Mount read-write so the CLI can refresh OAuth tokens.
      - /root/.claude:/root/.claude
      # TradingAgents clones the pinned upstream repo and builds a venv on
      # first run. Keep that cache out of the container layer so deploys do
      # not pay the bootstrap cost every time.
      - tradingagents_skill:/app/data/tradingagents-skill
    healthcheck:
      # Probe /readyz (not /health): /health is a pure-Python liveness ping
      # that returns 200 even when Postgres/Redis are unreachable, so a broken
      # DB can leave the container flagged "healthy" and keep it in the
      # dependent-service rotation. /readyz runs SELECT 1 + redis PING under
      # short timeouts and returns 503 when either dep is down, which is the
      # signal docker/compose uses to gate caddy's `depends_on ... healthy`.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 4g
    cpus: 2.0

  timescaledb:
    environment:
      POSTGRES_USER: alphadesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: alphadesk
    volumes:
      - /var/lib/alphadesk/timescaledb:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=3GB
      - -c
      # Wave 3L Fix 6 (persona-86/90): app pool is 20+10=30 per worker;
      # with -w 1 that's 30 at peak, but 150 gives comfortable headroom
      # for admin sessions, pgbouncer, alembic migrations, and future
      # horizontal-scale to multiple workers (each up to 30 connections)
      # without hitting the ceiling and returning "too many connections"
      # mid-request. Was 100, which was tight once we factored in admin
      # and migration sessions.
      - max_connections=150
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 3g
    cpus: 2.0

  redis:
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - /var/lib/alphadesk/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alphadesk
    logging:
      driver: json-file
      options:
        # Bumped from 10m×3 (30 MB) to 50m×5 (250 MB/service). Old rotation
        # held only a few hours of traffic, making "what happened yesterday?"
        # impossible. Disk budget: ~1 GB across 5 services on a 38 GB VPS.
        # See observability-audit-r4.md P2 #14.
        max-size: "50m"
        max-file: "5"
    mem_limit: 1200m
    cpus: 1.0

  # uptime-kuma: removed 2026-04-17 (Wave E / iter-2).
  # Had zero monitors configured; consuming ~56 MB RSS + 724 MB image for
  # no benefit. On-disk data preserved at /var/lib/alphadesk/uptime-kuma
  # so the service can be re-added later and pick up its existing DB.

networks:
  alphadesk:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  tradingagents_skill:
