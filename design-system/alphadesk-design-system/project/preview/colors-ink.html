<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);width:700px;overflow:hidden}
  .card{padding:24px;min-height:120px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:8px;align-items:stretch}
  .swatch{flex:1;height:72px;border-radius:var(--radius-sm);position:relative;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--border-hair)}
  .swatch .meta{font-family:var(--font-mono);font-size:9.5px;color:rgba(255,255,255,0.7);letter-spacing:0.02em;display:flex;justify-content:space-between;width:100%}
  .swatch .meta b{font-weight:500;color:#fff}
  .caption{display:flex;justify-content:space-between;align-items:baseline}
  .caption .ttl{font-family:var(--font-display);font-style:italic;font-size:18px;color:var(--ink-1000);letter-spacing:-0.02em}
  .caption .desc{font-family:var(--font-ui);font-size:11px;color:var(--fg-muted);letter-spacing:var(--tracking-label);text-transform:uppercase}
</style></head>
<body>
<div class="card">
  <div class="caption"><div class="ttl">Ink &amp; paper</div><div class="desc">Neutral scale · 11 steps</div></div>
  <div class="row">
    <div class="swatch" style="background:var(--ink-000)"><div class="meta"><span>000</span><b>#050503</b></div></div>
    <div class="swatch" style="background:var(--ink-050)"><div class="meta"><span>050</span><b>#0b0a09</b></div></div>
    <div class="swatch" style="background:var(--ink-100)"><div class="meta"><span>100</span><b>#111110</b></div></div>
    <div class="swatch" style="background:var(--ink-150)"><div class="meta"><span>150</span><b>#15140f</b></div></div>
    <div class="swatch" style="background:var(--ink-200)"><div class="meta"><span>200</span><b>#1c1a14</b></div></div>
    <div class="swatch" style="background:var(--ink-300)"><div class="meta"><span>300</span><b>#2a271d</b></div></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:var(--ink-500);border-color:transparent"><div class="meta" style="color:rgba(0,0,0,0.5)"><span>500</span><b style="color:#111">#5b5547</b></div></div>
    <div class="swatch" style="background:var(--ink-600);border-color:transparent"><div class="meta" style="color:rgba(0,0,0,0.5)"><span>600</span><b style="color:#111">#7d7665</b></div></div>
    <div class="swatch" style="background:var(--ink-700);border-color:transparent"><div class="meta" style="color:rgba(0,0,0,0.5)"><span>700</span><b style="color:#111">#a8a08d</b></div></div>
    <div class="swatch" style="background:var(--ink-800);border-color:transparent"><div class="meta" style="color:rgba(0,0,0,0.5)"><span>800</span><b style="color:#111">#d4cdb8</b></div></div>
    <div class="swatch" style="background:var(--ink-900);border-color:transparent"><div class="meta" style="color:rgba(0,0,0,0.6)"><span>900</span><b style="color:#111">#ece6d2</b></div></div>
    <div class="swatch" style="background:var(--ink-1000);border-color:transparent"><div class="meta" style="color:rgba(0,0,0,0.6)"><span>1000</span><b style="color:#111">#f7f1dc</b></div></div>
  </div>
</div>
</body></html>
