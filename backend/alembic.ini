# Alembic configuration for AlphaDesk.
#
# --- How to run ---
#
# Production (first time only — one-off, marks the existing DB as baselined):
#     docker exec alphadesk-backend alembic stamp 0001_baseline
#     docker exec alphadesk-backend alembic upgrade head
#
# Production (ongoing, after the baseline stamp has been applied once):
#     docker exec alphadesk-backend alembic upgrade head
#
# Developer (local, from the backend/ directory with a DATABASE_URL in .env):
#     cd backend && alembic upgrade head
#
# Generate a new autogenerated migration:
#     cd backend && alembic revision --autogenerate -m "description"
#
# See backend/alembic/README.md for more detail.

[alembic]
# Path to the migration scripts, relative to this file.
script_location = alembic

# Template used when generating migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamps in file_template / the Create Date header.
timezone = UTC

# Max length of the slug portion of generated migration filenames.
truncate_slug_length = 40

# Set to 'true' if you want Alembic to prepend the current revision
# version number to "alembic revision" migration file names.
# revision_environment = false

# Set to 'true' if you want sourceless files.
# sourceless = false

# Version paths (pipe separated list of locations with migration scripts).
# version_locations = %(here)s/alembic/versions

# Output encoding for revision files.
output_encoding = utf-8

# Placeholder. The real database URL is loaded from AlphaDesk's settings
# (core.config) inside alembic/env.py and this value is overridden at runtime.
# DO NOT put real credentials here.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ---------------------------------------------------------------------------
# Logging configuration (standard boilerplate from ``alembic init``).
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
